<!DOCTYPE html>
<html
    lang="fi"
    xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Kirjautuminen HuittMP</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>
<body>
     <div class="container mt-4">
        <h1 class="mb-5">HuittMP – Jäsenhallinta</h1>
        <div class="col-md-5 mx-auto">
            <h4 class="mb-3">Kirjaudu sisään</h4>

            <div th:if="${param.error}" class="text-danger mb-3">Virheellinen sähköpostiosoite tai salasana</div>
            <div th:if="${param.logout}" class="text-success mb-3">Olet kirjautunut ulos</div>
     
            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">Sähköposti:</label>
                    <input type="email" id="username" name="username" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Salasana:</label>
                    <input type="password" id="password" name="password" class="form-control"required>
                </div>
            <button type="submit" class="btn btn-primary">Kirjaudu sisään</button>
        </form>
        </div>
    </div>
</body>
</html>
