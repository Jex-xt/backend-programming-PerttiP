<!DOCTYPE html>
<!-- HuittMP:n jäsenen tietosivu ylläpitäjälle, jossa näytetään jäsenen perustiedot, maksut ja roolit -->
<html
    lang="fi"
    xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Jäsentiedot</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>
<body>
    <div class="container mt-4">
        <h1>HuittMP – Jäsenhallinta</h1>
        <h4 class="mb-5">Jäsenen tiedot</h4>

        <!-- Html-taulukko jäsenen perustiedoille -->
        <table class="table table-striped">
            <tbody>
                <tr>
                    <th>ID</th>
                    <td th:text="${jasen.id}"></td>
                </tr>
                <tr>
                    <th>Etunimi</th>
                    <td th:text="${jasen.etunimi}"></td>
                </tr>
                <tr>
                    <th>Sukunimi</th>
                    <td th:text="${jasen.sukunimi}"></td>
                </tr>
                <tr>
                    <th>Sähköposti</th>
                    <td th:text="${jasen.email}"></td>
                </tr>
                <tr>
                    <th>Puhelinnumero</th>
                    <td th:text="${jasen.puhelinnumero}"></td>
                </tr>
                <tr>
                    <th>Liittymispäivä</th>
                    <td th:text="${#temporals.format(jasen.liittymispaiva, 'd.M.yyyy')}"></td>
                </tr>
                <tr>
                    <th>Käyttöoikeus</th>
                    <td>
                        <span th:if="${jasen.yllapitaja}">Ylläpitäjä</span>
                        <span th:unless="${jasen.yllapitaja}">Käyttäjä</span>
                    </td>
                </tr>

            </tbody>
        </table>

        <h4>Jäsenen maksut</h4>

        <!-- Html-taulukko jäsenen maksutapahtumille -->
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Maksu</th>
                    <th>Kausi</th>
                    <th>Maksettu</th>
                    <th>Pyörien määrä</th>
                </tr>
            </thead>
            <tbody>
                <!-- JasenMaksu lista käydään läpi ja luodaan jokaiselle maksutapahtumalle oma taulukkorivi -->
                <tr th:each="jasenMaksu : ${jasenMaksut}">
                    <td th:text="${jasenMaksu.maksu.maksuNimi}"></td>
                    <td th:text="${jasenMaksu.maksu.maksuKausi}"></td>

                    <td>
                        <span th:if="${jasenMaksu.maksettu}">Kyllä</span>
                        <span th:unless="${jasenMaksu.maksettu}">Ei</span>
                    </td>
                    <td>
                        <span th:if="${jasenMaksu.pyorienMaara != null}"
                        th:text="${jasenMaksu.pyorienMaara}"></span>

                        <span th:unless="${jasenMaksu.pyorienMaara != null}">-</span>
                    </td>
                </tr>
            </tbody>
        </table>

        <h4>Jäsenen roolit</h4>

        <!-- Html-taulukko jäsenen rooleille -->
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Rooli</th>
                    <th>Alkamispäivä</th>
                    <th>Päättymispäivä</th>
                </tr>
            </thead>
            <tbody>
                <!-- JasenRoolit lista käydään läpi ja luodaan jokaiselle roolille oma taulukkorivi -->
                <tr th:each="jasenRooli : ${jasenRoolit}">
                <td th:text="${jasenRooli.rooli.rooliNimi}"></td>
                <td th:text="${#temporals.format(jasenRooli.alkupaiva, 'd.M.yyyy')}"></td>
                <td>
                    <span th:if="${jasenRooli.loppupaiva != null}"
                        th:text="${#temporals.format(jasenRooli.loppupaiva, 'd.M.yyyy')}"></span>
                    <span th:unless="${jasenRooli.loppupaiva != null}">Voimassa</span>
                </td>
                </tr>
            </tbody>
        </table>
        <!-- Linkit takaisin jäsenlistasivulle tai jäsenen tietojen muokkaussivulle -->
        <div class="mt-4">     
            <a th:href="@{/admin}" class="btn btn-secondary">Jäsenlista</a>
            <a th:href="@{/admin/muokkaa/{id}(id=${jasen.id})}" class="btn btn-primary">Muokkaa</a>
        </div>
    </div>
</body>
</html>
