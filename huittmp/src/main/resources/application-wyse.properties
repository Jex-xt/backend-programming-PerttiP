#Sovelluksen nimi
spring.application.name=huittmp
# PostgreSQL-tietokanta Dell Wyse koti palvelimella
spring.datasource.url=jdbc:postgresql://192.168.32.185:5432/huittmp
# Tietokannan käyttäjätunnus ja salasana Windowsin ympäristömuuttujissa
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# Tarkistaa, että JPA-entiteetit vastaavat tietokannan rakennetta.
# Ei luo tai muuta tietokannan tauluja.
spring.jpa.hibernate.ddl-auto=validate
# Näyttää Hibernate SQL-kyselyt konsolissa
spring.jpa.show-sql=true