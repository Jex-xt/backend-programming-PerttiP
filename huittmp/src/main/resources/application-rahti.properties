# PostgreSQL-tietokantayhteys Rahti-palvelimella

# Sovelluksen nimi
spring.application.name=huittmp
# PostgreSQL-tietokannan yhteys rahti palvelimella
spring.datasource.url=jdbc:postgresql://${POSTGRESQL_SERVICE_HOST}:${POSTGRESQL_SERVICE_PORT}/${DB_NAME}
#Tietokannan käyttäjätunnus ja salasana Rahdin ympäristömuuttujissa
spring.datasource.username=${PUKKI_DB_USER}
spring.datasource.password=${PUKKI_DB_PASSWORD}
# Tarkistaa, että JPA-entiteetit vastaavat tietokannan rakennetta.
# Ei luo tai muuta tietokannan tauluja.
spring.jpa.hibernate.ddl-auto=validate