<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>addbook</title>
    <meta charset="UTF-8">
</head>
<body>
    <h1>Add new book</h1>
<div>
<form th:object="${book}" th:action="@{/save}" action="#" method="post">
	<label for="title">Title:</label>
	<input type="text" id="title" th:field="*{title}" />
	<label for="author">Author:</label>
	<input type="text" id="author" th:field="*{author}" />
	<label for="isbn">ISBN:</label>
	<input type="text" id="isbn" th:field="*{isbn}" />
    <label for="publicationYear">Year:</label> <!-- Nollan saa pois lomakkeesta muuttamalla Book luokassa publicationYear tyypiksi Integer --> 
	<input type="number" id="publicationYear" th:field="*{publicationYear}" />
	<input type="submit" value="Save" />
</form>

</div>
</body>
</html>
